<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleta de Dados de Locais com Foto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; display: flex; justify-content: center; }
        .form-container { width: 100%; max-width: 450px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .form-group textarea { resize: vertical; height: 120px; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Enviar Cadastro de Local</h2>
    
    <!-- Usando a URL /submit padrão para o chat não esconder o código -->
    <form id="meuForm" action="https://formsubmit.co" method="POST" enctype="multipart/form-data">
        
        <!-- O destino correto do seu e-mail configurado aqui -->
        <input type="hidden" name="email" value="qwert8496.tudo@gmail.com">
        
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="Novo Cadastro de Local Pelo Site">
        <input type="hidden" name="_next" value="https://github.com">

        <div class="form-group">
            <label for="local">Local:</label>
            <input type="text" name="Local" id="local" placeholder="Ex: Parque Ibirapuera" required>
        </div>

        <div class="form-group">
            <label for="uf">UF (Estado):</label>
            <select name="Estado_UF" id="uf" required>
                <option value="" disabled selected>Selecione o estado</option>
                <option value="SP">SP</option>
                <option value="RJ">RJ</option>
                <option value="MG">MG</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição:</label>
            <textarea name="Descrição" id="descricao" placeholder="Digite detalhes sobre este local..." required></textarea>
        </div>

        <div class="form-group">
            <label for="campoInputImagem">Escolha ou tire uma foto do local:</label>
            <!-- Atributo name="Foto_do_Local" fixo no HTML para o FormSubmit aceitar o anexo -->
            <input type="file" name="Foto_do_Local" id="campoInputImagem" accept="image/*" required />
        </div>

        <button type="submit">Enviar Dados</button>
    </form>
</div>

<script>
    // Gerencia o envio e comprime a imagem para evitar o erro 413 (arquivo muito grande)
    document.getElementById("meuForm").addEventListener("submit", function(e) {
        var inputFoto = document.getElementById("campoInputImagem");
        
        // Se o arquivo já foi comprimido pelo nosso script, deixa o envio nativo acontecer
        if (inputFoto.dataset.comprimido === "true") {
            return; 
        }

        // Caso contrário, para o envio para comprimir a foto primeiro
        e.preventDefault();
        
        if (inputFoto.files.length === 0) {
            return;
        }

        var form = this;
        var arquivoOriginal = inputFoto.files[0];
        var leitor = new FileReader();

        leitor.onload = function(event) {
            var img = new Image();
            img.onload = function() {
                var canvas = document.createElement("canvas");
                var max_size = 1200;
                var width = img.width;
                var height = img.height;

                if (width > height) {
                    if (width > max_size) {
                        height *= max_size / width;
                        width = max_size;
                    }
                } else {
                    if (height > max_size) {
                        width *= max_size / height;
                        height = max_size;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                var ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                canvas.toBlob(function(blob) {
                    var arquivoComprimido = new File([blob], "foto_local.jpg", { type: "image/jpeg" });
                    
                    var dataTransfer = new DataTransfer();
                    dataTransfer.items.add(arquivoComprimido);
                    inputFoto.files = dataTransfer.files;

                    // Marca o input como comprimido para não entrar em loop infinito
                    inputFoto.dataset.comprimido = "true";

                    // Dispara o envio oficial com a foto leve
                    form.submit();
                }, "image/jpeg", 0.7);
            };
            img.src = event.target.result;
        };
        leitor.readAsDataURL(arquivoOriginal);
    });
</script>

</body>
</html>
