<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleta de Dados de Locais com Foto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; display: flex; justify-content: center; }
        .form-container { width: 100%; max-width: 450px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .form-group textarea { resize: vertical; height: 120px; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Enviar Cadastro de Local</h2>
    <form id="formColeta">
        <input type="hidden" id="chaveAcesso" value="b281d76d-9536-4e8e-83c9-39e400b7b7c5">
        <div class="form-group"><label for="local">Local:</label><input type="text" id="local" required></div>
        <div class="form-group"><label for="uf">UF:</label><select id="uf" required><option value="" disabled selected>Estado</option><option value="SP">SP</option></select></div>
        <div class="form-group"><label for="descricao">Descrição:</label><textarea id="descricao" required></textarea></div>
        <div class="form-group"><label for="campoInputImagem">Foto:</label><input type="file" id="campoInputImagem" accept="image/*" required /></div>
        <button type="submit" id="btnEnviar">Enviar Dados</button>
    </form>
</div>

<script>
document.getElementById('formColeta').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('btnEnviar');
    btn.innerText = 'Enviando...'; btn.disabled = true;
    var formData = new FormData();
    formData.append('access_key', document.getElementById('chaveAcesso').value);
    formData.append('Local', document.getElementById('local').value);
    formData.append('attachment', document.getElementById('campoInputImagem').files[0]);
    fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData })
    .then(r => r.json()).then(d => {
        if (d.success) { alert('Sucesso!'); window.location.reload(); }
        else { alert('Erro: ' + d.message); btn.innerText = 'Enviar'; btn.disabled = false; }
    });
});
</script>
</body>
</html>
