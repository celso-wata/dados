<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleta de Dados de Locais com Foto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; display: flex; justify-content: center; }
        .form-container { width: 100%; max-width: 450px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .form-group textarea { resize: vertical; height: 120px; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Enviar Cadastro de Local</h2>
    
    <!-- O action fica vazio. O JavaScript abaixo resolverá o envio -->
    <form id="meuFormulario">
        
        <div class="form-group">
            <label for="local">Local:</label>
            <input type="text" id="local" placeholder="Ex: Parque Ibirapuera" required>
        </div>

        <div class="form-group">
            <label for="uf">UF (Estado):</label>
            <select id="uf" required>
                <option value="" disabled selected>Selecione o estado</option>
                <option value="SP">SP</option>
                <option value="RJ">RJ</option>
                <option value="MG">MG</option>
            </select>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição:</label>
            <textarea id="descricao" placeholder="Digite detalhes sobre este local..." required></textarea>
        </div>

        <div class="form-group">
            <label for="campoInputImagem">Escolha ou tire uma foto do local:</label>
            <input type="file" id="campoInputImagem" accept="image/*" required />
        </div>

        <button type="submit">Enviar Dados</button>
    </form>
</div>

<script>
document.getElementById('meuFormulario').addEventListener('submit', function(e) {
    e.preventDefault(); // Impede o erro de redirecionamento

    // Monta os dados do formulário manualmente
    var dadosDoForm = new FormData();
    dadosDoForm.append('Local', document.getElementById('local').value);
    dadosDoForm.append('Estado_UF', document.getElementById('uf').value);
    dadosDoForm.append('Descrição', document.getElementById('descricao').value);
    dadosDoForm.append('Foto_do_Local', document.getElementById('campoInputImagem').files[0]);
    
    // Configurações do FormSubmit
    dadosDoForm.append('_captcha', 'false');
    dadosDoForm.append('_subject', 'Novo Cadastro de Local Pelo Site');

    // Aqui montamos a URL do FormSubmit usando letras separadas para o chat não quebrar
    var destino = 'https://' + 'formsubmit.co' + '/ajax/' + 'qwert8496.tudo' + '@' + 'gmail.com';

    // Envia de forma invisível via AJAX
    fetch(destino, {
        method: 'POST',
        body: dadosDoForm
    })
    .then(response => {
        if (response.ok) {
            alert('Dados enviados com sucesso! Verifique seu e-mail para ativar o formulário caso seja o primeiro envio.');
            window.location.href = 'https://github.com';
        } else {
            alert('Houve um erro no servidor do FormSubmit.');
        }
    })
    .catch(error => {
        alert('Erro na conexão com o servidor.');
    });
});
</script>

</body>
</html>
